group:
  - repos: |
      themoment-team/datagsm-server
    files:
      - source: .claude/agents/
        dest: .claude/agents/
      - source: .claude/hooks/
        dest: .claude/hooks/
      - source: .claude/skills/
        dest: .claude/skills/
      - source: .agents/skills/
        dest: .agents/skills/
      - source: .codex/
        dest: .codex/
      - source: .gemini/
        dest: .gemini/

  # 프론트엔드 프로젝트
  - repos: |
      themoment-team/everygsm-v2
      themoment-team/readygsm
      themoment-team/hello-gsm-26
    files:
      - source: .claude/agents/
        dest: .claude/agents/
      - source: .claude/hooks/
        dest: .claude/hooks/
      - source: .claude/skills/
        dest: .claude/skills/
      - source: .agents/skills/
        dest: .agents/skills/
      - source: .codex/
        dest: .codex/
      - source: .gemini/
        dest: .gemini/

