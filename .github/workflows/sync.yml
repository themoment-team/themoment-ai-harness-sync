name: Sync AI Harness files

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Install PyJWT
        run: pip install PyJWT cryptography -q

      - name: Generate sync targets from App installations
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          SOURCE_REPO: themoment-team/ai-harness
        run: python3 scripts/list-installed-repos.py > /tmp/dynamic-sync.yml

      - name: Show sync targets
        run: cat /tmp/dynamic-sync.yml

      - uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_PATH: /tmp/dynamic-sync.yml
          PR_LABELS: harness-sync
          COMMIT_PREFIX: "chore"
          PR_BODY: "themoment-ai-harness-sync에서 자동 동기화된 파일입니다."