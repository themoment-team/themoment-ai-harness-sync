name: Sync AI Harness files

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      stats: ${{ steps.list.outputs.stats }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: pip install PyJWT cryptography pyyaml -q
      - name: List installations and build matrix
        id: list
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          SOURCE_REPO: themoment-team/themoment-ai-harness-sync
        run: |
          matrix=$(python3 scripts/list-installed-repos.py)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  sync:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    # 잡 이름을 레포별로 유일하게 만들어 report 잡이 실패 레그의 로그를 찾을 수 있게 한다
    name: sync ${{ matrix.installation.repo }}
    strategy:
      matrix:
        installation: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      # 개별 레그 실패가 다른 레그를 취소하지 않게 한다
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      # 아래 스텝들은 모두 continue-on-error로 감싸 잡 자체는 항상 성공한다.
      # 진짜 결과는 각 스텝의 outcome을 읽어 마지막 Record 스텝이 기록한다.
      - name: Generate token
        id: app-token
        continue-on-error: true
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_retrieval_mode: id
          installation_retrieval_payload: ${{ matrix.installation.inst_id }}

      - name: Verify base branch exists
        id: basecheck
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          repo="${{ matrix.installation.repo }}"
          base="${{ matrix.installation.base_branch }}"
          gh api "/repos/$repo/branches/$base" --silent

      - name: Write sync config
        if: steps.basecheck.outcome == 'success'
        run: echo '${{ matrix.installation.config }}' > /tmp/sync.yml
      - name: Show sync config
        if: steps.basecheck.outcome == 'success'
        run: cat /tmp/sync.yml

      - name: Compute PR metadata
        id: pr-meta
        if: steps.basecheck.outcome == 'success'
        env:
          LANG_SETTING: ${{ matrix.installation.language }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$LANG_SETTING" = "ko" ]; then
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
              RANGE="HEAD~5..HEAD"
            else
              RANGE="$BEFORE_SHA..HEAD"
            fi
            COMMIT_MSG=$(git log --format="%H %s" "$RANGE" 2>/dev/null | while read hash subject; do
              count=$(git diff-tree --no-commit-id -r "$hash" --name-only 2>/dev/null | wc -l)
              printf '%d\t%s\n' "$count" "$subject"
            done | sort -rn | head -1 | cut -f2-)
            [ -z "$COMMIT_MSG" ] && COMMIT_MSG=$(git log -1 --format="%s")
            DESCRIPTION="${COMMIT_MSG#*: }"
            echo "title=[global] $DESCRIPTION" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF'
              echo 'themoment-ai-harness-sync에서 파일이 자동으로 동기화되었습니다.'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "title=Sync files from themoment-ai-harness-sync" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF'
              echo 'Automated file sync from themoment-ai-harness-sync.'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Sync files
        id: sync
        if: steps.basecheck.outcome == 'success'
        continue-on-error: true
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_PATH: /tmp/sync.yml
          PR_LABELS: ${{ matrix.installation.pr_labels }}
          BRANCH_PREFIX: ${{ matrix.installation.branch_prefix }}
          COMMIT_PREFIX: "chore"
          COMMIT_EACH_FILE: false
          PR_BODY: ${{ steps.pr-meta.outputs.body }}

      # BetaHuhn 액션에는 PR_TITLE 입력이 없어 제목을 직접 지정할 수 없다.
      # 액션이 만든 sync PR의 제목을 pr-meta에서 계산한 값으로 덮어쓴다.
      - name: Set sync PR title
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_TITLE: ${{ steps.pr-meta.outputs.title }}
        run: |
          repo="${{ matrix.installation.repo }}"
          branch="${{ matrix.installation.branch_prefix }}${{ matrix.installation.base_branch }}"
          num=$(gh pr list --repo "$repo" --state open --head "$branch" \
                  --json number --jq '.[0].number // empty')
          if [ -n "$num" ] && [ -n "$PR_TITLE" ]; then
            echo "set PR #$num title: $PR_TITLE"
            gh pr edit "$num" --repo "$repo" --title "$PR_TITLE"
          else
            echo "no open sync PR ($branch) or empty title — skip"
          fi
      - name: Delete orphaned files
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pip install pyyaml -q
          python3 scripts/apply-deletions.py \
            --repo "${{ matrix.installation.repo }}" \
            --branch-prefix "${{ matrix.installation.branch_prefix }}" \
            --base-branch "${{ matrix.installation.base_branch }}" \
            --pr-label "${{ matrix.installation.pr_labels }}"
      - name: Retarget open sync PRs to base branch
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr list \
            --repo "${{ matrix.installation.repo }}" \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("${{ matrix.installation.branch_prefix }}")) | .number' \
          | xargs -r -I{} gh pr edit {} \
              --repo "${{ matrix.installation.repo }}" \
              --base "${{ matrix.installation.base_branch }}"

      - name: Record result
        if: always()
        env:
          REPO: ${{ matrix.installation.repo }}
          SERVER_URL: ${{ github.server_url }}
          JOB_NAME: sync ${{ matrix.installation.repo }}
          BASE_BRANCH: ${{ matrix.installation.base_branch }}
          TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          BASE_OUTCOME: ${{ steps.basecheck.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          mkdir -p results
          python3 scripts/record-sync-result.py > "results/result-${{ strategy.job-index }}.json"
          cat "results/result-${{ strategy.job-index }}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-result-${{ strategy.job-index }}
          path: results/result-${{ strategy.job-index }}.json
          retention-days: 3

  report:
    runs-on: ubuntu-latest
    needs: [prepare, sync]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download results
        if: needs.sync.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: sync-result-*
          path: results
          merge-multiple: true
      - name: Render report to job summary
        env:
          RESULTS_DIR: results
          STATS: ${{ needs.prepare.outputs.stats }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SYNC_RESULT: ${{ needs.sync.result }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render-sync-report.py
